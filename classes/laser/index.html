<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ILCA 6 Explorer · Young Sails</title>
<meta name="description" content="Interactive 3D model of the ILCA 6 dinghy (formerly Laser Radial), built to class-rule dimensions, with every part selectable and explained for young sailors.">
<link rel="icon" href="../../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/explorer.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.147.0/examples/jsm/"
} }
</script>
</head>
<body class="explorer">
<div id="app">
  <canvas id="scene" tabindex="0" data-i18n-attr="aria-label:ui.canvasAria"></canvas>
  <div id="labels" aria-hidden="true"></div>
  <div id="tip"></div>
  <div id="loading" data-i18n="ui.loading">Rigging the boat…</div>

  <!-- right column: site navigation, parts list -->
  <div class="rail rail-nav">
    <nav id="siteNav" class="site-nav panel"></nav>
    <aside class="parts panel sheet" id="parts" data-i18n-attr="aria-label:ui.partsAria">
      <header><h2 data-i18n="ui.parts">Parts</h2><small id="partCount"></small>
        <button class="sheet-close" data-sheet="parts" data-i18n-attr="aria-label:ui.close">&times;</button></header>
      <div class="list" id="partList"></div>
    </aside>
  </div>

  <!-- left column: boat title, info card -->
  <div class="rail rail-boat">
    <div class="rail-head">
      <a class="brand-site panel" href="../../">Young <b>Sails</b></a>
      <div class="brand panel">
        <h1 id="modelTitle">ILCA 6</h1>
        <div class="sheet-toggles">
          <button class="tg" data-sheet="parts" aria-expanded="false" aria-controls="parts" data-i18n="ui.parts">Parts</button>
          <button class="tg" data-sheet="cardPanel" aria-expanded="false" aria-controls="cardPanel" data-i18n="ui.info">Info</button>
        </div>
      </div>
    </div>
    <section class="card panel sheet" id="cardPanel" data-i18n-attr="aria-label:ui.infoAria">
      <button class="sheet-close" data-sheet="cardPanel" data-i18n-attr="aria-label:ui.close">&times;</button>
      <div id="card" aria-live="polite"></div>
    </section>
  </div>

  <nav class="toolbar panel" data-i18n-attr="aria-label:ui.viewControls">
    <div class="seg" role="group" data-i18n-attr="aria-label:ui.scene">
      <button id="sceneWater" aria-pressed="true" data-i18n="ui.water">Water</button>
      <button id="sceneStudio" aria-pressed="false" data-i18n="ui.studio">Studio</button>
    </div>
    <div class="trim">
      <label for="trim" class="eyebrow-label"><span data-i18n="ui.boom">Boom</span> <output id="trimOut" for="trim"></output></label>
      <input id="trim" type="range" min="-85" max="85" step="1" value="-20">
    </div>
    <button class="tg" id="explode" aria-pressed="false" data-i18n="ui.explode">Explode</button>
    <button class="tg" id="labelsBtn" aria-pressed="false" data-i18n="ui.labels">Labels</button>
    <button class="tg" id="spin" aria-pressed="false" data-i18n="ui.spin">Spin</button>
    <div class="sep"></div>
    <div class="sw" role="group" id="swatches" data-i18n-attr="aria-label:ui.hullColour"></div>
    <button class="tg" id="reset" data-i18n="ui.reset" data-i18n-attr="title:ui.resetTitle">Reset</button>
  </nav>

  <footer id="siteFoot" class="site-foot"></footer>
</div>

<script type="module">
  import { startExplorer } from '../../assets/js/explorer/explorer.js';
  import { mountSiteNav } from '../../assets/js/core/sitenav.js';
  import { createLaser } from '../../models/laser/laser.js';
  import { PARTS, GROUPS, PAINTS } from '../../models/laser/parts.js';

  mountSiteNav({ current: 'laser' });
  startExplorer({ createModel: createLaser, parts: PARTS, groups: GROUPS, paints: PAINTS, ns: 'laser' })
    .catch(err => {
      console.error(err);
      document.getElementById('loading').outerHTML = '<div id="err" class="panel">The 3D view could not start. Check your connection and reload the page.</div>';
    });
</script>
</body>
</html>
